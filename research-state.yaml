project:
  title: Observation-level uncertainty signals for tool-using agents
  question: At the tool-return step, which uncertainty signals separate clean from corrupted tool returns, and how
    does that degrade as the agent has less context about what a normal return looks like?
  status: active
  started: '2026-10-31'
  domain: LLM agents / uncertainty quantification
  venue: ICLR 2027 workshop (~2027-02-01); optional AAAI MATH4AI 4p (2026-11-20)
literature:
  key_papers:
  - id: '2609.37153'
    title: ToxicBench
    relevance: env-1; paired clean/toxic runs; 26-39pt drops
  - id: '2610.10062'
    title: Loud/Quiet Failures
    relevance: prompting to check has no effect; error channel not content
  - id: '2607.10059'
    title: AgentAbstain
    relevance: abstention independent of capability; post-hoc abstention
  - id: '2608.22676'
    title: Robustness Analysis
    relevance: Qwen3-8B retail paired-return study; schema/full-prefix content likelihood + legal-action distribution
      entropy; distinct from our mean-token entropy (official v2 II-B/C)
  - id: '2608.11552'
    title: Trajectory-Adapted UQ
    relevance: multi-method comparison at trajectory level
  - id: '2610.09115'
    title: VoS
    relevance: 5 UQ methods at step level; no signal locates the step; no corruption
  - id: '2610.05572'
    title: Difficulty vs run-level failure
    relevance: pooled AUROC is cross-unit; report within-table AUROC
  - id: '2610.30491'
    title: Trace vs label
    relevance: silent tool-output override confounds C2 labels
  open_problems:
  - Whether controlled visible-row budgets change scalar tool-return checking, on the measured tasks
  - Whether structured summaries derived from identical rows improve model evidence use on fresh queries (not yet
    tested)
  evidence_gaps:
  - Intrinsic signals lack live sanity controls; H1 protocol slice/AP versions conflict
  - P5 scorer configurations fail sanity/coverage; registered real-corruption gain withheld
  - 0o/0o* are finite Monte Carlo privileged references; no optimality bound or information decomposition
  - Only 12 fixed context-pilot queries, 6 table clusters; resampled rows are not new tasks or model replies
  - Scalar scoring excludes multi-number observations; no deployed intervention/cost benefit established
hypotheses:
- id: H1
  statement: 'A-P4: token entropy and verbalized, subtle log-ratio bin, T1: upper 95% CI of AUROC < 0.60 and AUPRC
    < 2x base rate, per open agent'
  status: not-confirmed-version-conflict-and-missing-sanity
  priority: high
  result: A-P4 subtle+AP differs from A-P4b P+S upper-CI. Both cached slices audited retrospectively; see hypothesis
    ledger.
- id: H2
  statement: 'A-P4: for 0d and 7 separately, AUROC minus prior (4): lower CI > 0.20 at T0_agent, upper CI < 0.10
    at T1'
  status: not-evaluated-as-registered
  priority: high
  result: Prior signal 4 not implemented; P5 is not a substitute.
- id: H3
  statement: 'Clean-only scorer transfers to held-out corruption types (sign_flip, label_swap): drop < 0.05; BCE
    classifier drop > 0.15'
  status: not-run
  priority: medium
  result: No held-out corruption-type transfer/BCE experiment.
- id: H4
  statement: Signal ranking is stable across open agents (Kendall tau > 0.7)
  status: not-established
  priority: medium
  result: Incomplete signal panel and gate failures; no complete ranking stability claim.
- id: H5
  statement: 'Closed agents: verbalized subtle-tier AUROC < 0.60'
  status: not-confirmed
  priority: medium
  result: 'A-P4-Gemini: 630 runs; subtle paired scalar 7/73 tasks, 3 tables; AUROC 0.556 [0.500,0.667]. Upper CI
    misses 0.60; low coverage. See F9.'
- id: H6
  statement: 'Amended: consumed-observation-failure events have higher scorer surprise (7) and re-execution distance
    (0d) than capability-failure events (d > 0.5); intrinsic signals do not differ (|d| < 0.2). 0a arm removed.
    Exploratory if either class < 50 events'
  status: exploratory
  priority: high
  note: 25 observation-failure pairs at subtle/numerical (taxonomy 2026-10-31)
- id: G1
  statement: 'A-P1 gate: excess toxic-failure over two-clean-seed noise floor, lower CI>0 overall AND numerical;
    15% share rule retired'
  status: supported-under-A-P1
  priority: high
  parent: H6
  result: Excess toxic failure lower CI>0 overall and numerical; original 15% share criterion retired.
- id: G2
  statement: 'PILOT GATE: range check with min/max removed (head-5 tier) AUROC > 0.90 on aggregate_scale -> activate
    ''rules suffice'' narrative fork and pull env-2 forward'
  status: rules-suffice-fork-not-established
  priority: high
  parent: H2
  result: A-P4 requires T1 P+S lower CI>0.90 and coverage>=50%; do not infer a general bound from the historical
    expectation.
